<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D ARCHIVE // JORDAN FERRARY</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gallery.css">

</head>

<body>

    <main>

        <section class="gallery-page">

            <header class="gallery-header">

                <a href="../index.html" class="back">
                    <span class="back-symbol">←</span>
                    BACK TO ARCHIVE
                </a>

                <div class="gallery-kicker">
                    JORDAN FERRARY // ARCHIVE 02
                </div>

                <h1 class="gallery-title">
                    3D ART
                </h1>

                <p class="gallery-description">

                    Modelagem, ambientes, materiais,
                    iluminação, composição e renders.

                </p>

            </header>


            <div class="gallery-controls">

                <button class="filter-button active" data-filter="all">
                    ALL
                </button>

                <button class="filter-button" data-filter="environment">
                    ENVIRONMENT
                </button>

                <button class="filter-button" data-filter="character">
                    CHARACTER
                </button>

                <button class="filter-button" data-filter="render">
                    RENDER
                </button>

            </div>


            <div class="gallery-grid">


                <article class="gallery-card" data-category="environment">

                    <div class="gallery-card-image"
                        style="background-image:url('assets/projeto-001/imagens/thumbnail.jpg')"></div>

                    <div class="gallery-card-overlay"></div>

                    <div class="gallery-card-content">

                        <small>
                            ENVIRONMENT
                        </small>

                        <h3>
                            PROJECT 01
                        </h3>

                        <p>
                            Environment and world building.
                        </p>

                        <a href="assets/projeto-001/index.html" class="gallery-card-link">
                            VIEW PROJECT →
                        </a>

                    </div>

                </article>


                <article class="gallery-card" data-category="character">

                    <div class="gallery-card-image zoomable">
                        <!-- 
          src: é a imagem que aparece no card (pode ser o thumbnail)
          data-zoom: é a imagem gigante e SEM CORTES que vai abrir no clique!
        -->
                        <img src="assets/projeto-002/imagens/thumbnail.jpg"
                            data-zoom="assets/projeto-002/imagens/imagem-completa-gigante.jpg" alt="Project 02">
                    </div>

                    <div class="gallery-card-overlay"></div>
                    <div class="gallery-card-content">
                        <!-- Seu conteúdo... -->
                    </div>

                </article>
                <article class="gallery-card" data-category="render">

                    <div class="gallery-card-image"
                        style="background-image:url('assets/projeto-003/imagens/thumbnail.jpg')"></div>

                    <div class="gallery-card-overlay"></div>

                    <div class="gallery-card-content">

                        <small>
                            CGI RENDER
                        </small>

                        <h3>
                            PROJECT 03
                        </h3>

                        <p>
                            Lighting and final render.
                        </p>

                        <a href="assets/projeto-003/index.html" class="gallery-card-link">
                            VIEW PROJECT →
                        </a>

                    </div>

                </article>

            </div>

        </section>

    </main>


    <script>

        const buttons =
            document.querySelectorAll(".filter-button");

        const cards =
            document.querySelectorAll(".gallery-card");


        buttons.forEach(button => {

            button.addEventListener("click", () => {

                buttons.forEach(btn =>
                    btn.classList.remove("active")
                );

                button.classList.add("active");

                const filter =
                    button.dataset.filter;

                cards.forEach(card => {

                    if (
                        filter === "all" ||
                        card.dataset.category === filter
                    ) {

                        card.style.display = "";

                    } else {

                        card.style.display = "none";

                    }

                });

            });

        });

    </script>

    <script>
const zoomImages = document.querySelectorAll(".zoomable img");
const lightbox = document.getElementById("imageLightbox");
const lightboxImage = document.getElementById("lightboxImage");
const closeButton = document.querySelector(".lightbox-close");

zoomImages.forEach(image => {
    image.addEventListener("click", () => {
        
        // Pega a imagem grande que colocamos no data-zoom!
        // Se você esquecer de colocar o data-zoom, ele usa o src normal de fallback
        const imagemGrande = image.getAttribute("data-zoom") || image.src;
        
        lightboxImage.src = imagemGrande;
        lightboxImage.alt = image.alt;

        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
    });
});

function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
    setTimeout(() => { lightboxImage.src = ""; }, 300);
}

closeButton.addEventListener("click", closeLightbox);

lightbox.addEventListener("click", event => {
    if (event.target === lightbox || event.target === lightboxImage) {
        closeLightbox();
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && lightbox.classList.contains("active")) {
        closeLightbox();
    }
});
</script>

</body>

</html>
